<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="UNIHABITAT">
  <title>UNIHABITAT</title>
  <defs>
    <linearGradient id="uh-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F07A3C"/>
      <stop offset="1" stop-color="#E2653B"/>
    </linearGradient>
  </defs>

  <!-- Building skyline (varying heights, left→right), drawn as one fill.
       Baseline of buildings ≈ y=150; they sit just above the curved swoosh. -->
  <g fill="url(#uh-orange)">
    <!-- 1: short block, far left -->
    <rect x="47"  y="112" width="17" height="38" rx="1.5"/>
    <!-- 2: medium with stepped notch -->
    <rect x="67"  y="86"  width="15" height="64" rx="1.5"/>
    <rect x="70"  y="78"  width="9"  height="10"/>
    <!-- 3: tallest, center-left, with stepped crown -->
    <rect x="86"  y="56"  width="22" height="94" rx="2"/>
    <rect x="89"  y="48"  width="16" height="10"/>
    <rect x="93"  y="41"  width="8"  height="9"/>
    <!-- 4: tall slim tower, center -->
    <rect x="112" y="66"  width="12" height="84" rx="1.5"/>
    <!-- 5: medium-tall right of center -->
    <rect x="128" y="80"  width="18" height="70" rx="1.5"/>
    <!-- 6: slim tall, right -->
    <rect x="150" y="70"  width="10" height="80" rx="1.5"/>
    <!-- 7: short cluster, far right -->
    <rect x="164" y="104" width="14" height="46" rx="1.5"/>
    <rect x="181" y="120" width="9"  height="30" rx="1.5"/>
  </g>

  <!-- Window slits knocked out of the buildings (cream/white to read as glass) -->
  <g fill="#FFFFFF" opacity="0.9">
    <!-- tallest tower windows -->
    <rect x="90"  y="66"  width="3" height="66"/>
    <rect x="97"  y="66"  width="3" height="66"/>
    <rect x="104" y="66"  width="3" height="66"/>
    <!-- tower 4 -->
    <rect x="115" y="76"  width="2.4" height="62"/>
    <rect x="119.5" y="76" width="2.4" height="62"/>
    <!-- building 5 -->
    <rect x="131" y="90"  width="2.6" height="52"/>
    <rect x="136" y="90"  width="2.6" height="52"/>
    <rect x="141" y="90"  width="2.6" height="52"/>
    <!-- building 2 -->
    <rect x="70"  y="96"  width="2.4" height="46"/>
    <rect x="74.5" y="96" width="2.4" height="46"/>
    <!-- tower 6 -->
    <rect x="153" y="80"  width="2" height="62"/>
    <rect x="156.5" y="80" width="2" height="62"/>
  </g>

  <!-- Curved swoosh base — arcs up at both ends, thicker in the middle -->
  <path fill="url(#uh-orange)"
        d="M32 158
           C 78 138, 162 138, 208 158
           C 162 150, 78 150, 32 158 Z"/>
</svg>
